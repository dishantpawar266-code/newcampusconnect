{% extends "base.html" %}
{% block title %}403 Forbidden — Campus Connect{% endblock %}
{% block page_title %}Access Denied{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;margin:0 auto">
  <div class="empty-state">
    <div class="empty-state-icon" style="font-size:64px;color:var(--gray-400)">403</div>
    <div class="empty-state-title" style="font-size:24px;margin-bottom:12px">Access Denied</div>
    <div class="empty-state-text" style="margin-bottom:24px">
      You do not have permission to view this page. This action is restricted to a different role.
    </div>
    <a href="{{ url_for('dashboard') if current_user else url_for('index') }}" class="btn btn-primary">
      ← Back to Home
    </a>
  </div>
</div>
{% endblock %}
